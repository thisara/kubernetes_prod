apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "file-api.name" . }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: {{ .Values.rollingUpdate.maxSurge }}
      maxUnavailable: {{ .Values.rollingUpdate.maxUnavailable }}
  selector:
    matchLabels:
      {{- include "file-api.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "file-api.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "file-api.name" . }}
      containers:
        - name: {{ .Values.container.name | quote }}
          image: {{ printf "%s:%s" .Values.image.repository .Values.image.tag | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.container.port }}
          envFrom:
            - configMapRef:
                name: {{ include "file-api.name" . }}
          env:
            - name: {{ .Values.container.env.name | quote }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "file-api.name" . }}-encryption
                  key: {{ .Values.container.env.key | quote }}
          livenessProbe:
            {{- toYaml .Values.probes.liveness | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.probes.readiness | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
