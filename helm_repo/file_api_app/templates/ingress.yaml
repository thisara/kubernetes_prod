apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "file-api.name" . }}
  annotations:
    {{- $annotations := dict "alb.ingress.kubernetes.io/scheme" .Values.ingress.scheme "alb.ingress.kubernetes.io/target-type" "ip" "alb.ingress.kubernetes.io/healthcheck-path" "/health" "alb.ingress.kubernetes.io/success-codes" "200" }}
    {{- toYaml (mergeOverwrite $annotations .Values.ingress.annotations) | nindent 4 }}
spec:
  ingressClassName: alb
  rules:
    - {{ if .Values.ingress.host }}host: {{ .Values.ingress.host | quote }}{{ end }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "file-api.name" . }}
                port:
                  name: http
