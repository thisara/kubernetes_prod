apiVersion: {{ .Values.externalSecrets.apiVersion }}
kind: SecretStore
metadata:
  name: {{ include "file-api.name" . }}
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ .Values.externalSecrets.region }}
---
apiVersion: {{ .Values.externalSecrets.apiVersion }}
kind: ExternalSecret
metadata:
  name: {{ include "file-api.name" . }}-encryption
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ include "file-api.name" . }}
    kind: SecretStore
  target:
    name: {{ include "file-api.name" . }}-encryption
    creationPolicy: Owner
  data:
    - secretKey: {{ .Values.externalSecrets.secretKey | quote }}
      remoteRef:
        key: {{ .Values.externalSecrets.remoteKey | quote }}
        {{- with .Values.externalSecrets.property }}
        property: {{ . | quote }}
        {{- end }}
